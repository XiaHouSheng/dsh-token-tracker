# dsh-token-tracker bundle layer. Applied when a profile lists this bundle
# (dsh plugin --profile <name> add dsh-token-tracker). Inserts the plugin row;
# the Host half serves /dsh-token-tracker + /api. The browser half is served
# when the same row reaches a web composition's loader entries (auto-discovered
# through dsh.client).
- insert:
    - id: token-tracker
      name: dsh-token-tracker
